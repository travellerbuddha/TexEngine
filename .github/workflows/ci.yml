name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: TEX i18n catalogs complete (en, tr, de, ru, ro, pl)
        run: npm run i18n:tex
        working-directory: frontend
      - name: Verify TEX guest booking bundle and widget
        run: |
          grep -q "/assets/kamra/frontend/assets/" kamra/public/frontend/booking.html
          test -s kamra/public/tex/tex-widget.js
      - name: Verify production serve base
        # The served SPA must reference its assets under /assets/kamra/frontend/;
        # a wrong base here silently breaks the /kamra install.
        run: grep -q "/assets/kamra/frontend/assets/" kamra/public/frontend/index.html

  evals:
    name: Backend eval harness
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      mariadb:
        image: mariadb:11.8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=10

    steps:
      - uses: actions/checkout@v4
        with:
          path: apps/kamra

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y redis-server mariadb-client
          sudo service redis-server start
          npm install -g yarn

      - name: Configure MariaDB
        run: |
          mysql -h 127.0.0.1 -uroot -proot -e "
            SET GLOBAL character_set_server = 'utf8mb4';
            SET GLOBAL collation_server = 'utf8mb4_unicode_ci';"

      - name: Init bench
        run: |
          pip install frappe-bench
          # pinned to the stable release tag: the version-16 branch tip
          # currently ships an UnboundLocalError in frappe/locale.py
          bench init --skip-redis-config-generation --skip-assets \
            --frappe-branch v16.25.0 frappe-bench
          cd frappe-bench
          bench set-config -g db_host 127.0.0.1
          bench set-config -g redis_cache redis://127.0.0.1:6379
          bench set-config -g redis_queue redis://127.0.0.1:6379
          bench set-config -g redis_socketio redis://127.0.0.1:6379

      - name: Install app & site
        run: |
          cd frappe-bench
          bench get-app payments
          bench get-app kamra "${GITHUB_WORKSPACE}/apps/kamra"
          bench new-site test.localhost \
            --mariadb-user-host-login-scope='%' \
            --db-root-password root --admin-password admin
          bench --site test.localhost install-app kamra
          bench --site test.localhost set-config developer_mode 1

      - name: Run eval harness
        run: |
          cd frappe-bench
          printf 'from kamra.scripts.eval_harness import execute\nexecute()\nexit\n' \
            | bench --site test.localhost console | tee eval.out
          grep -q "76/76 passed" eval.out

      - name: Run the banquet unit tests
        run: |
          cd frappe-bench
          bench --site test.localhost set-config allow_tests true
          bench --site test.localhost run-tests --module kamra.tests.test_banquet \
            2>&1 | tee banquet.out
          grep -qE "^OK$" banquet.out

      - name: Run TEX pure unit tests (pricing, gateways, FX, segments)
        run: |
          cd frappe-bench
          ./env/bin/python -m unittest discover -s apps/kamra/kamra/tex/tests/unit -t apps/kamra 2>&1 | tee tex_unit.out
          grep -qE "^OK$" tex_unit.out

      - name: Run TEX integration tests (journey, concurrency, commercial flows)
        run: |
          cd frappe-bench
          for m in test_critical_journey test_concurrency test_commercial_flows test_migrations_notify \
                   test_security_regressions test_public_booking \
                   test_admin_markets test_extras_inventory test_post_booking_extras test_custom_domains test_crm_segments; do
            bench --site test.localhost run-tests --module kamra.tex.tests.integration.$m 2>&1 | tee tex_$m.out
            grep -qE "^OK$" tex_$m.out
          done

      - name: Run front-desk persona journey
        run: |
          cd frappe-bench
          printf 'from kamra.scripts.frontdesk_eval import execute\nexecute()\nexit\n' \
            | bench --site test.localhost console | tee journey.out
          grep -q "13/13 passed" journey.out

      - name: Fresh-install correctness (roles bind, SPA serves)
        run: |
          cd frappe-bench
          cat > /tmp/fresh_check.py <<'PY'
          import os, frappe
          roles = ["Front Desk","Housekeeping","Finance","Revenue Manager","Kamra Agent","Hotel Admin"]
          missing = [r for r in roles if not frappe.db.exists("Role", r)]
          assert not missing, f"roles auto-create failed: {missing}"
          assert frappe.get_all("DocPerm", filters={"parent":"Reservation"}), "no Reservation perms bound"
          assert os.path.exists(frappe.get_app_path("kamra","public","frontend","index.html")), "built SPA not shipped"
          assert os.path.exists(frappe.get_app_path("kamra","www","kamra.py")), "SPA boot page missing"
          rules = str(frappe.get_hooks("website_route_rules"))
          assert "/kamra/<path:app_path>" in rules, "/kamra route rule missing"
          print("FRESH-INSTALL CHECKS PASSED")
          PY
          printf 'exec(open("/tmp/fresh_check.py").read())\nexit\n' \
            | bench --site test.localhost console | tee fresh.out
          grep -q "FRESH-INSTALL CHECKS PASSED" fresh.out

      - name: Browser E2E (Playwright, R-58 journey + booking/CRS/contract specs)
        run: |
          cd frappe-bench
          bench --site test.localhost execute kamra.tex.devtools.demo_seed.execute \
            --kwargs "{'password': 'TexDemo#2026'}"
          bench --site test.localhost set-config -p tex_public_write_limit 1000
          bench --site test.localhost set-config -p tex_public_search_limit 1000
          echo "127.0.0.1 test.localhost" | sudo tee -a /etc/hosts
          # --skip-assets: link the app's committed bundles where the web server looks
          mkdir -p sites/assets
          [ -e sites/assets/kamra ] || ln -s "$(pwd)/apps/kamra/kamra/public" sites/assets/kamra
          nohup bench serve --port 8000 > serve.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://test.localhost:8000/api/method/ping > /dev/null && break
            sleep 2
          done
          cd ../apps/kamra/frontend
          npm ci
          npx playwright install --with-deps chromium
          TEX_E2E_BASE=http://test.localhost:8000 TEX_E2E_PASSWORD='TexDemo#2026' \
            npx playwright test -c e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/kamra/e2e-report
            apps/kamra/e2e-results
            frappe-bench/serve.log
